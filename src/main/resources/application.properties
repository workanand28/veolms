spring.application.name=veolms
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veolms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Anand2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Show SQL in the development console
spring.jpa.show-sql=true

# Flyway migration location and activation
spring.flyway.locations=classpath:db/migration

